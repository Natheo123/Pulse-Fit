name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install dependencies
        run: npm ci

      - name: Build static web (Capacitor)
        run: npm run build:mobile

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseFit-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release asset
        run: |
          mkdir -p dist-apk
          VERSION="${GITHUB_REF_NAME}"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            VERSION="latest"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist-apk/PulseFit-${VERSION}.apk"
          echo "APK_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && format('PulseFit {0}', github.ref_name) || 'PulseFit (latest APK)' }}
          files: dist-apk/PulseFit-${{ env.APK_VERSION }}.apk
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          make_latest: true
          overwrite_files: true
          body: |
            ## PulseFit APK (sideload)

            1. Télécharge `PulseFit-*.apk` ci-dessous
            2. Sur Android : autorise l'installation depuis le navigateur / sources inconnues
            3. Ouvre le fichier APK et installe

            Pas besoin de compte Play Store.
